<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💞 FAHRI ❤️ MIA - Selamanya Bersama 💞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#FF2E63',
                        soft: '#FFE6F2',
                        darklove: '#D90429',
                        gentle: '#FFC8DD',
                        ungu: '#C77DFF',
                        biru: '#00B4D8'
                    },
                    fontFamily: {
                        utama: ['"Segoe UI"', 'sans-serif'],
                        judul: ['"Arial Black"', 'sans-serif']
                    },
                    animation: {
                        'masuk-pelan': 'masukPelan 1.2s ease-out forwards',
                        'detak-kuat': 'detakKuat 1.2s infinite',
                        'pelangi-putar': 'pelangiPutar 6s linear infinite',
                        'naik-turun': 'naikTurun 3s ease-in-out infinite',
                        'hati-penuh': 'hatiPenuh 0.8s ease forwards',
                        'muncul-atas': 'munculAtas 0.7s ease forwards',
                        'berkedip': 'berkedip 2s infinite'
                    },
                    keyframes: {
                        masukPelan: {
                            '0%': { opacity: '0', transform: 'translateY(50px) scale(0.9)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' }
                        },
                        detakKuat: {
                            '0%,100%': { transform: 'scale(1)' },
                            '25%': { transform: 'scale(1.2)' },
                            '50%': { transform: 'scale(1)' },
                            '75%': { transform: 'scale(1.15)' }
                        },
                        pelangiPutar: {
                            '0%': { borderColor: '#FF2E63', boxShadow: '0 0 18px #FF2E63' },
                            '20%': { borderColor: '#FF9F1C', boxShadow: '0 0 18px #FF9F1C' },
                            '40%': { borderColor: '#2EC4B6', boxShadow: '0 0 18px #2EC4B6' },
                            '60%': { borderColor: '#3A86FF', boxShadow: '0 0 18px #3A86FF' },
                            '80%': { borderColor: '#C77DFF', boxShadow: '0 0 18px #C77DFF' },
                            '100%': { borderColor: '#FF2E63', boxShadow: '0 0 18px #FF2E63' }
                        },
                        naikTurun: {
                            '0%,100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' }
                        },
                        hatiPenuh: {
                            '0%': { transform: 'scale(0)', opacity: '1' },
                            '50%': { transform: 'scale(1.8)', opacity: '0.8' },
                            '100%': { transform: 'scale(0)', opacity: '0' }
                        },
                        munculAtas: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        berkedip: {
                            '0%,100%': { opacity: '1' },
                            '50%': { opacity: '0.5' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'utama', sans-serif; scroll-behavior: smooth; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #FFF0F5, #FFE6F2, #F8F0FF); min-height: 100vh; }
        .kaca { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-radius: 18px; }
        .bingkai-pelangi { border: 4px solid; animation: pelangiPutar infinite; }
        .geser-kiri-kanan { display: flex; gap: 18px; overflow-x: auto; padding: 18px 0; scroll-snap-type: x mandatory; }
        .geser-kiri-kanan::-webkit-scrollbar { height: 10px; border-radius: 5px; }
        .geser-kiri-kanan::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #FF2E63, #C77DFF); border-radius: 5px; }
        .item-geser { scroll-snap-align: start; min-width: 290px; flex-shrink: 0; }
        .layar-pembuka { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(160deg, #FFC8DD, #FFAFCC, #CDB4DB); transition: all 1.2s ease; }
        .hilang-pembuka { opacity: 0; visibility: hidden; transform: scale(1.1); }
        .tombol-spesial { transition: all 0.25s ease; transform-origin: center; }
        .tombol-spesial:active { transform: scale(0.92) rotate(1deg); }
        .tombol-spesial:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(255,46,99,0.35); }
        .wadah-komentar { max-height: 550px; overflow-y: auto; }
        .wadah-komentar::-webkit-scrollbar { width: 8px; }
        .wadah-komentar::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #FF2E63, #C77DFF); border-radius: 4px; }
        .animasi-hati { position: absolute; pointer-events: none; font-size: 2rem; animation: hatiPenuh 0.8s ease forwards; }
        .balasan { margin-left: 3rem; border-left: 2px solid #FFC8DD; padding-left: 1rem; margin-top: 0.5rem; }
        .teks-judul { font-family: 'judul', sans-serif; letter-spacing: 2px; text-shadow: 0 3px 10px rgba(217,4,41,0.2); }
    </style>
</head>
<body>

    <!-- MUSIK LATAR BERLANJUT TERUS -->
    <audio id="musikLatar" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        <!-- GANTI LINK DI ATAS DENGAN LAGU KESUKAAN KALIAN -->
    

    <!-- ANIMASI PEMBUKA SPESIAL FAHRI & MIA -->
    <div id="layarPembuka" class="layar-pembuka">
        <div class="text-8xl animate-detak-kuat mb-6">❤️</div>
        <h1 class="text-4xl md:text-6xl teks-judul text-darklove animate-masuk-pelan opacity-0">FAHRI & MIA</h1>
        <p class="text-xl md:text-2xl text-darklove mt-4 animate-masuk-pelan opacity-0" style="animation-delay:0.5s;">Bersama Sejak 16 Juni 2024</p>
        <p class="text-lg mt-6 animate-berkedip" style="animation-delay:1s;">Membuka dunia kita...</p>
    </div>

    <!-- Tombol Kembali Ke Atas -->
    <button id="kePuncak" class="fixed bottom-8 right-8 z-50 w-14 h-14 rounded-full bg-love text-white text-xl shadow-xl opacity-0 invisible tombol-spesial">
        <i class="fa fa-arrow-up"></i>
    </button>

    <!-- NAVIGASI UTAMA -->
    <nav class="sticky top-0 z-40 kaca bingkai-pelangi mx-3 mt-3 px-5 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="#beranda" class="flex items-center gap-3">
                <span class="text-2xl animate-detak-kuat">💞</span>
                <span class="text-xl font-bold text-darklove">Fahri & Mia</span>
            </a>
            <div class="hidden md:flex gap-6 text-sm font-semibold">
                <a href="#beranda" class="hover:text-love transition-colors">Beranda</a>
                <a href="#galeri" class="hover:text-love transition-colors">Galeri Geser</a>
                <a href="#kenangan" class="hover:text-love transition-colors">Kenangan</a>
                <a href="#komentar" class="hover:text-love transition-colors">Pesan & Balas</a>
            </div>
            <button id="bukaMenu" class="md:hidden text-2xl">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <div id="menuHp" class="hidden md:hidden mt-4 flex flex-col gap-3 pb-2">
            <a href="#beranda" class="py-2 border-b border-gentle">Beranda</a>
            <a href="#galeri" class="py-2 border-b border-gentle">Galeri Geser</a>
            <a href="#kenangan" class="py-2 border-b border-gentle">Kenangan</a>
            <a href="#komentar" class="py-2">Pesan & Balas</a>
        </div>
    </nav>

    <!-- HALAMAN UTAMA BERANDA -->
    <section id="beranda" class="max-w-7xl mx-auto px-4 py-14">
        <div class="flex flex-col md:flex-row items-center justify-center gap-12">
            <div class="animate-masuk-pelan opacity-0 md:w-1/2">
                <h1 class="text-[clamp(2.3rem,5vw,4rem)] teks-judul text-darklove mb-6">
                    Kita Sudah Bersama Selama:
                </h1>
                <div class="kaca bingkai-pelangi p-6 mb-6">
                    <p id="hariBersama" class="text-3xl md:text-4xl font-bold text-center text-love">0 Hari 💖</p>
                    <p class="text-center text-gray-600 mt-2">Dimulai dari 16 Juni 2024 sampai selamanya</p>
                </div>
                <p class="text-gray-700 text-lg leading-relaxed mb-6">
                    Halaman ini adalah bukti cinta Fahri untuk Mia. Semua kenangan, foto, dan ucapan ada di sini, abadi selamanya seperti cinta kita. 💞
                </p>
                <div class="flex flex-wrap gap-4">
                    <a href="#galeri" class="tombol-spesial bg-love text-white px-8 py-3 rounded-full font-semibold">Lihat Foto Kita 📷</a>
                    <a href="#komentar" class="tombol-spesial bingkai-pelangi text-darklove px-8 py-3 rounded-full font-semibold">Tinggalkan Pesan 💌</a>
                </div>
            </div>
            <div class="animate-naik-turun bingkai-pelangi rounded-3xl overflow-hidden shadow-2xl md:w-1/3">
                <img src="contoh poto.jpg" alt="Foto Fahri & Mia" class="w-full h-auto">
            </div>
        </div>
    </section>

    <!-- HALAMAN GALERI BISA GESER KIRI-KANAN -->
    <section id="galeri" class="max-w-7xl mx-auto px-4 py-14">
        <h2 class="text-3xl md:text-4xl teks-judul text-center text-darklove mb-8">📸 Geser Foto Kita 📸</h2>
        <div class="geser-kiri-kanan">
            ${Array.from({length:5}, (_,i) => `
                <div class="item-geser kaca bingkai-pelangi overflow-hidden">
                    <img src="poto${i+1}.jpg" alt="Foto ${i+1}" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-500">
                    <div class="p-5">
                        <h4 class="font-bold text-darklove mb-2">Foto Spesial ${i+1}</h4>
                        <div class="flex items-center gap-4 text-sm text-gray-600 mb-3">
                            <span><i class="fa fa-eye"></i> <span class="reach" data-id="poto${i+1}">0</span> Dilihat</span>
                            <span><i class="fa fa-heart"></i> <span class="suka" data-id="poto${i+1}">0</span> Suka</span>
                        </div>
                        <button class="w-full py-3 bg-love/10 text-love rounded-xl font-semibold tombol-spesial tombol-suka" data-id="poto${i+1}">
                            <i class="fa fa-heart"></i> Suka Ini ❤️
                        </button>
                    </div>
                </div>
            `).join('')}
        </div>
    </section>

    <!-- HALAMAN KENANGAN -->
    <section id="kenangan" class="max-w-7xl mx-auto px-4 py-14">
        <h2 class="text-3xl md:text-4xl teks-judul text-center text-darklove mb-10">💞 Kenangan Tak Terlupakan 💞</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7">
            ${Array.from({length:8}, (_,i) => `
                <div class="kaca bingkai-pelangi overflow-hidden hover:shadow-2xl transition-all duration-300">
                    <img src="kenangan${i+1}.jpg" alt="Kenangan ${i+1}" class="w-full h-56 object-cover hover:scale-110 transition-transform duration-600">
                    <div class="p-5">
                        <h4 class="font-bold text-darklove mb-2">Momen Ke-${i+1}</h4>
                        <p class="text-sm text-gray-600 mb-4">Setiap detik bersamamu adalah kebahagiaan Fahri 🥰</p>
                        <button class="tombol-spesial text-love font-semibold tombol-suka" data-id="kenangan${i+1}">
                            <i class="fa fa-heart"></i> <span class="suka" data-id="kenangan${i+1}">0</span> Suka
                        </button>
                    </div>
                </div>
            `).join('')}
        </div>
    </section>

    <!-- HALAMAN KOMENTAR BISA BALAS & GULIR -->
    <section id="komentar" class="max-w-3xl mx-auto px-4 py-14">
        <h2 class="text-3xl md:text-4xl teks-judul text-center text-darklove mb-8">💌 Kolom Pesan & Balasan 💌</h2>
        <p class="text-center text-gray-600 mb-8">Kirim ucapan, doa, atau balas pesan orang lain seperti di medsos!</p>

        <!-- Form Kirim Pesan -->
        <div class="kaca bingkai-pelangi p-6 mb-6">
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Nama Kamu</label>
                        <input type="text" id="namaPengirim" placeholder="Contoh: Fahri / Mia" class="w-full px-4 py-3 rounded-xl border border-gentle focus:outline-none focus:ring-2 focus:ring-love">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Emoji Profil</label>
                        <select id="pilihEmoji" class="w-full px-4 py-3 rounded-xl border border-gentle focus:outline-none focus:ring-2 focus:ring-love">
                            <option value="💖">💖 Fahri</option>
                            <option value="🥰">🥰 Mia</option>
                            <option value="😊">😊 Teman</option>
                            <option value="🌹">🌹 Ucapan</option>
                            <option value="💑">💑 Kita</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Pesanmu</label>
                    <textarea id="isiPesan" rows="3" placeholder="Tulis pesan cinta atau doa..." class="w-full px-4 py-3 rounded-xl border border-gentle focus:outline-none focus:ring-2 focus:ring-love"></textarea>
                </div>
                <button id="kirimPesan" class="w-full py-3 bg-love text-white rounded-xl font-bold tombol-spesial">
                    Kirim Pesan 💌
                </button>
            </div>
        </div>

        <!-- Daftar Komentar Bisa Digulir -->
        <div class="kaca bingkai-pelangi p-5">
            <h3 class="text-xl font-bold text-darklove mb-4">Pesan Terbaru</h3>
            <div id="wadahKomentar" class="wadah-komentar space-y-5 pr-2">
                <p class="text-center text-gray-500 py-12">Memuat pesan dari seluruh dunia...</p>
            </div>
        </div>
    </section>

    <footer class="bg-darklove text-white py-8 text-center mt-12 rounded-t-3xl">
        <p class="text-xl font-bold">💞 FAHRI & MIA - BERSAMA SAMPAI TUA 💞</p>
        <p class="mt-3">Dibuat dengan cinta sejati sejak 16 Juni 2024</p>
    </footer>

    <script>
        // ==============================================
        // MUSIK LATAR BERLANJUT TERUS
        // ==============================================
        const musik = document.getElementById('musikLatar');
        // Mulai musik setelah pengguna klik halaman sekali
        const mulaiMusik = () => {
            musik.play().catch(e => console.log("Klik sekali untuk mulai musik:", e));
            document.removeEventListener('click', mulaiMusik);
        };
        document.addEventListener('click', mulaiMusik);

        // ==============================================
        // ANIMASI PEMBUKA & HITUNG HARI BERSAMA
        // ==============================================
        setTimeout(() => {
            document.getElementById('layarPembuka').classList.add('hilang-pembuka');
        }, 3500);

        // Hitung hari sejak 16 Juni 2024
        const tanggalAwal = new Date('2024-06-16');
        const sekarang = new Date();
        const selisih = Math.floor((sekarang - tanggalAwal) / (1000 * 60 * 60 * 24));
        document.getElementById('hariBersama').textContent = `${selisih} Hari Bersama 💖`;

        // ==============================================
        // MENU & TOMBOL NAVIGASI
        // ==============================================
        document.getElementById('bukaMenu').addEventListener('click', () => {
            document.getElementById('menuHp').classList.toggle('hidden');
        });

        const tombolAtas = document.getElementById('kePuncak');
        window.addEventListener('scroll', () => {
            if(window.scrollY > 400) {
                tombolAtas.classList.remove('opacity-0','invisible');
                tombolAtas.classList.add('opacity-100','visible');
            } else {
                tombolAtas.classList.add('opacity-0','invisible');
                tombolAtas.classList.remove('opacity-100','visible');
            }
        });
        tombolAtas.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

        // ==============================================
        // FIREBASE KAMU - SUDAH BENAR TERINSTAL
        // ==============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDuQmsUHotG-lW9tm5LKabUyw_ARwt_W2I",
            authDomain: "fashion-fahri-39262.firebaseapp.com",
            databaseURL: "https://fashion-fahri-39262-default-rtdb.firebaseio.com",
            projectId: "fashion-fahri-39262",
            storageBucket: "fashion-fahri-39262.firebasestorage.app",
            messagingSenderId: "647011821518",
            appId: "1:647011821518:web:279811ff7821e75bf32d9f",
            measurementId: "G-4491S31VK2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refPesan = db.ref('pesan_fahri_mia');
        const refDataFoto = db.ref('data_foto_kita');

        // ==============================================
        // KOMENTAR BISA BALAS & REAL TIME
        // ==============================================
        refPesan.on('value', (snap) => {
            const wadah = document.getElementById('wadahKomentar');
            wadah.innerHTML = '';
            const data = snap.val();
            if(!data) {
                wadah.innerHTML = '<p class="text-center text-gray-500 py-12">Jadilah orang pertama yang kirim pesan untuk Fahri & Mia ✨</p>';
                return;
            }
            Object.values(data).reverse().forEach(item => {
                const el = document.createElement('div');
                el.className = 'animate-muncul-atas';
                el.innerHTML = `
                    <div class="p-4 bg-white/60 rounded-xl">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-11 h-11 rounded-full bg-soft flex items-center justify-center text-2xl">${item.emoji}</div>
                            <div>
                                <h4 class="font-bold text-darklove">${item.nama}</h4>
                                <p class="text-xs text-gray-500">${new Date(item.waktu).toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <p class="text-gray-700 pl-14">${item.pesan}</p>
                        <button class="balas-btn mt-3 text-sm text-love hover:text-darklove tombol-spesial" data-nama="${item.nama}" data-id="${item.id}">
                            <i class="fa fa-reply"></i> Balas
                        </button>
                    </div>
                `;
                wadah.appendChild(el);
            });

            // Fitur Balas Komentar
            document.querySelectorAll('.balas-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const namaBalas = btn.dataset.nama;
                    const inputPesan = document.getElementById('isiPesan');
                    inputPesan.value = `@${namaBalas} `;
                    inputPesan.focus();
                });
            });
        });

        // Kirim Pesan Baru
        document.getElementById('kirimPesan').addEventListener('click', async () => {
            const nama = document.getElementById('namaPengirim').value.trim();
            const pesan = document.getElementById('isiPesan').value.trim();
            const emoji = document.getElementById('pilihEmoji').value;

            if(!nama || !pesan) return alert('Isi nama dan pesan dulu ya sayang 😊');

            try {
                await refPesan.push({
                    id: Date.now(),
                    nama, emoji, pesan,
                    waktu: Date.now()
                });
                document.getElementById('namaPengirim').value = '';
                document.getElementById('isiPesan').value = '';
                alert('Pesan terkirim! Semua orang bisa melihatnya sekarang 💞');
            } catch(err) {
                alert('Gagal kirim: ' + err.message + '\nPastikan aturan Firebase sudah diizinkan ya!');
            }
        });

        // ==============================================
        // ANIMASI SUKA HATI PENUH & DATA REAL TIME
        // ==============================================
        refDataFoto.on('value', (snap) => {
            const data = snap.val() || {};
            document.querySelectorAll('[data-id]').forEach(el => {
                const id = el.dataset.id;
                if(data[id]) {
                    if(el.classList.contains('reach')) el.textContent = data[id].reach || 0;
                    if(el.classList.contains('suka')) el.textContent = data[id].suka || 0;
                }
            });
        });

        // Tombol Suka dengan Animasi Hati Terbang
        document.querySelectorAll('.tombol-suka').forEach(tombol => {
            tombol.addEventListener('click', async function(e) {
                const id = this.dataset.id;
                const dataLama = (await refDataFoto.child(id).once('value')).val() || {suka:0, reach:0};
                await refDataFoto.child(id).update({ suka: (dataLama.suka || 0) + 1 });

                // Muncul animasi hati penuh
                const hati = document.createElement('span');
                hati.className = 'animasi-hati';
                hati.textContent = '❤️';
                hati.style.left = e.offsetX + 'px';
                hati.style.top = e.offsetY + 'px';
                this.style.position = 'relative';
                this.appendChild(hati);
                setTimeout(() => hati.remove(), 800);
            });
        });

        // Hitung Dilihat Otomatis
        setTimeout(async () => {
            document.querySelectorAll('.reach').forEach(async el => {
                const id = el.dataset.id;
                const dataLama = (await refDataFoto.child(id).once('value')).val() || {suka:0, reach:0};
                await refDataFoto.child(id).update({ reach: (dataLama.reach || 0) + 1 });
            });
        }, 3000);
    </script>
</body>
</html>
